# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Catches the two failure modes that have actually happened to this repo:
  # (1) a GitHub web upload creating a stray "index_1.html" instead of
  #     overwriting index.html, leaving the live site unchanged, and
  #     (2) index.html changing without its mandatory date field being
  #     updated (CLAUDE.md's "MANDATORY RULE"). This runs whether the push
  #     came from a real git push or a manual web edit/upload — the local
  #     pre-commit hook (scripts/check_datestamp.sh) only fires for the
  #     former, so this is the backstop for the latter.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: index.html must exist, with no stray duplicates
        run: |
          if [ ! -f index.html ]; then
            echo "::error::index.html is missing from the repo root — deploying now would take the live site down."
            exit 1
          fi

          STRAY=$(find . -maxdepth 1 -regextype posix-extended -type f -iregex '.*/index[ _]*([0-9]+|\([0-9]+\))\.html$')
          if [ -n "$STRAY" ]; then
            echo "::error::Found stray duplicate index file(s) — this is the exact pattern left behind by a GitHub web upload that failed to overwrite index.html:"
            echo "$STRAY"
            exit 1
          fi

      - name: Determine whether index.html changed in this push
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- index.html | grep -q .; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # Manual re-run / can't diff (e.g. force-push, workflow_dispatch) — check anyway to be safe.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: index.html's date field must show today's date (only if index.html changed)
        if: steps.changed.outputs.changed == 'true'
        run: |
          TODAY=$(TZ="America/Chicago" date '+%-m/%-d/%Y')
          if ! grep -Eq "📅 (Creation Date|Last Updated) = ${TODAY}" index.html; then
            FOUND=$(grep -Eo "📅 (Creation Date|Last Updated) = [0-9]{1,2}/[0-9]{1,2}/[0-9]{4}" index.html | head -1)
            echo "::error::index.html changed in this push but its 📅 Creation Date/Last Updated field doesn't show today's date ($TODAY, America/Chicago). Found: ${FOUND:-none found}. Per CLAUDE.md's mandatory rule, update that field before this can deploy."
            exit 1
          fi

  # Single deploy job, gated on validate passing.
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
